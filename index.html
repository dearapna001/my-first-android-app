
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 Game</title>

<style>
body {
  margin: 0;
  background: #faf8ef;
  font-family: Arial;
  text-align: center;
  color: #776e65;
}

.container {
  max-width: 400px;
  margin: 30px auto;
  padding: 15px;
}

h1 {
  font-size: 55px;
  margin: 10px;
}

.score {
  font-size: 20px;
  font-weight: bold;
  margin: 15px;
}

button {
  background: #8f7a66;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 7px;
  font-size: 16px;
}

#board {
  background: #bbada0;
  padding: 8px;
  border-radius: 8px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  touch-action: none;
}

.tile {
  aspect-ratio: 1;
  background: #cdc1b4;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(20px, 7vw, 32px);
  font-weight: bold;
}

.n2 { background: #eee4da; }
.n4 { background: #ede0c8; }
.n8 { background: #f2b179; color: white; }
.n16 { background: #f59563; color: white; }
.n32 { background: #f67c5f; color: white; }
.n64 { background: #f65e3b; color: white; }
.n128, .n256, .n512,
.n1024, .n2048 {
  background: #edcf72;
  color: white;
  font-size: 23px;
}
</style>
</head>

<body>

<div class="container">
<h1>2048</h1>

<div class="score">
Score: <span id="score">0</span>
</div>

<button onclick="restart()">New Game</button>

<p>Join the numbers and reach 2048!</p>

<div id="board"></div>

<p>Swipe up, down, left or right to play.</p>
</div>

<script>
let board = [];
let score = 0;
let over = false;

function restart() {
  board = Array(16).fill(0);
  score = 0;
  over = false;
  addTile();
  addTile();
  draw();
}

function addTile() {
  let empty = [];
  board.forEach((v, i) => {
    if (v === 0) empty.push(i);
  });

  if (empty.length === 0) return;

  let i = empty[Math.floor(Math.random() * empty.length)];
  board[i] = Math.random() < 0.9 ? 2 : 4;
}

function draw() {
  let el = document.getElementById("board");
  el.innerHTML = "";

  board.forEach(v => {
    let tile = document.createElement("div");
    tile.className = "tile " + (v ? "n" + v : "");
    tile.textContent = v || "";
    el.appendChild(tile);
  });

  document.getElementById("score").textContent = score;
}

function slide(line) {
  let a = line.filter(v => v !== 0);

  for (let i = 0; i < a.length - 1; i++) {
    if (a[i] === a[i + 1]) {
      a[i] *= 2;
      score += a[i];
      a.splice(i + 1, 1);
    }
  }

  while (a.length < 4) a.push(0);
  return a;
}

function move(dir) {
  if (over) return;

  let old = board.slice();

  for (let i = 0; i < 4; i++) {
    let indexes = [];

    for (let j = 0; j < 4; j++) {
      if (dir === "left") indexes.push(i * 4 + j);
      if (dir === "right") indexes.push(i * 4 + (3 - j));
      if (dir === "up") indexes.push(j * 4 + i);
      if (dir === "down") indexes.push((3 - j) * 4 + i);
    }

    let line = indexes.map(k => board[k]);
    let result = slide(line);

    indexes.forEach((k, j) => {
      board[k] = result[j];
    });
  }

  if (old.join() !== board.join()) {
    addTile();
    draw();
    checkGame();
  }
}

function checkGame() {
  if (board.includes(2048)) {
    alert("Congratulations! You reached 2048!");
    over = true;
    return;
  }

  for (let i = 0; i < 16; i++) {
    if (board[i] === 0) return;

    if (i % 4 !== 3 && board[i] === board[i + 1]) return;
    if (i < 12 && board[i] === board[i + 4]) return;
  }

  over = true;
  alert("Game Over! Start a new game.");
}

document.addEventListener("keydown", e => {
  const keys = {
    ArrowLeft: "left",
    ArrowRight: "right",
    ArrowUp: "up",
    ArrowDown: "down"
  };

  if (keys[e.key]) {
    e.preventDefault();
    move(keys[e.key]);
  }
});

let startX = 0;
let startY = 0;

const boardElement = document.getElementById("board");

boardElement.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
}, {passive: true});

boardElement.addEventListener("touchend", e => {
  let dx = e.changedTouches[0].clientX - startX;
  let dy = e.changedTouches[0].clientY - startY;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? "right" : "left");
  } else {
    move(dy > 0 ? "down" : "up");
  }
});

restart();
</script>

</body>
</html>
